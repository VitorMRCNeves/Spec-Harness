# Exemplo preenchido (fase GREEN) — para referência de formato.
# Não é lido pelo harness; é só material de apoio para escrever packets novos.
#
# Os caminhos abaixo usam um layout de exemplo (`src/modules/<dominio>/`) e um domínio fictício.
# Troque pelos escopos e prefixos reais declarados em `scopes` do harness.config.json do seu
# repositório — o harness não assume convenção de diretório nenhuma.

schema_version: 2
packet_id: SDD-01-green
feature: faturamento-ledger-de-lancamentos
spec_number: 1
phase: green
app: faturamento
source_spec: .specs/sdd-faturamento-ledger-de-lancamentos/specs/01-ledger-service.md

required_reads:
  - .specs/sdd-faturamento-ledger-de-lancamentos/specs/01-ledger-service.md
  - src/modules/faturamento/tests/unit/test_ledger.py
  - src/modules/faturamento/models.py

verifies:
  requirements: [RF-01, RF-02, EC-01, EC-02, T-01, T-02, T-03]

done_when:
  requirements: [RF-01, RF-02, T-01, T-02, T-03]
  validation_ids: [test_green, test_integration_green]

capabilities:
  read:
    paths:
      - .specs/sdd-faturamento-ledger-de-lancamentos/specs/01-ledger-service.md
      - src/modules/faturamento/**
    justification: >
      GREEN precisa ler o teste RED (já escrito), os DTOs em models.py e o service do domínio
      para implementar sem reinventar infraestrutura existente.
  write:
    paths:
      - src/modules/faturamento/ledger.py
      - src/modules/faturamento/models.py
  bash:
    commands:
      - "pytest -q --no-cov -p no:cacheprovider src/modules/faturamento/tests/unit/test_ledger.py"
      - "pytest -q --no-cov -p no:cacheprovider src/modules/faturamento/tests/integration/test_ledger_router.py"

token_budget:
  max_initial_reads: 6
  max_initial_read_bytes: 400000
  max_read_lines: 500
  max_search_results: 50
  prefer_edit_over_write: true
  allow_broad_read: false

validation:
  commands:
    - id: test_green
      run: "pytest -q --no-cov -p no:cacheprovider src/modules/faturamento/tests/unit/test_ledger.py"
      required_result: pass
    - id: test_integration_green
      run: "pytest -q --no-cov -p no:cacheprovider src/modules/faturamento/tests/integration/test_ledger_router.py"
      required_result: pass
  artifacts:
    - path: src/modules/faturamento/ledger.py
      requirements: [RF-02]
      contains: ["logger."]
      not_contains: ["print("]
      min_count: 1

enforcement:
  blocked_tool_calls: review

manual_review:
  contract:
    must:
      - "ledger.py expõe registrar_lancamento(l: Lancamento) -> LedgerEntry com type hints completos"
      - "estados do ledger são Enum em models.py, não strings literais"
    must_not:
      - "nenhum except Exception antes das exceções específicas do domínio"
      - "nenhum acesso direto ao cache fora do repositório de dados do módulo"
  forbidden:
    behaviors:
      - "importar de outro módulo de domínio (src/modules/cobranca) a partir de faturamento"
      - "credencial lida de os.environ em vez do resolvedor de segredos do repositório"
  review:
    focus:
      - "confirmar que o service devolve o agregado completo, sem estado parcial em caso de erro"
