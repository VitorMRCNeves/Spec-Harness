# Template do packet unificado — normalmente você NÃO escreve isto à mão:
#   node .claude/spec_harness/harness.ts scaffold-packet .specs/sdd-<feature>/specs/NN-<spec>.md
# gera o arquivo a partir da spec. Este template serve de referência dos campos.
# Ver .claude/skills/spec-harness/references/task-packets.md.

schema_version: 2
unified: true
feature: <feature-slug>            # mesmo slug da pasta .specs/sdd-<feature-slug>/
spec_number: 1                     # NN da spec, sem zero-padding
app: <escopo>                      # escopo único da spec — um dos nomes declarados em
                                   # `scopes` do harness.config.json deste repositório
source_spec: .specs/sdd-<feature-slug>/specs/01-<nome-spec>.md

required_reads:
  - .specs/sdd-<feature-slug>/specs/01-<nome-spec>.md
  # + a spec dependida, quando houver 'Depende de' (leia só a seção ## Contratos dela)

# Leitura extra além da spec, dos testes e da produção desta spec. Só o necessário.
context_paths: []

# O que a fase RED pode escrever:
test_paths:
  - <prefixo-de-teste-do-escopo>/test_<modulo>.py

# O que a fase GREEN pode escrever (a fase VERIFY não escreve nada):
impl_paths:
  - <prefixo-de-producao-do-escopo>/<modulo>.py

# Vem de `scaffold.test_command_template` do harness.config.json. Precisa falhar com código != 0
# quando o teste da fase RED falha, e não abortar na coleta. Se o runner do repositório já força
# cobertura mínima via addopts, desligue-a aqui (em pytest, --no-cov): uma execução escopada a um
# arquivo reprovaria por cobertura mesmo com todos os testes verdes.
test_command: <comando de teste do repositório> <prefixo-de-teste-do-escopo>/test_<modulo>.py

# behavior_change (padrão, spec altera código existente) | new_module (+ missing_module)
red_expects: behavior_change

verifies:
  requirements: [RF-01, RF-02, EC-01, T-01]   # todos os IDs relevantes da spec

phases:
  red: {}
  green: {}
    # requirements: [RF-01]        # recorte de IDs desta fase (vazio = todos)
    # artifacts:                   # contratos estruturais, quando o teste não os observa
    #   - path: <prefixo-de-producao-do-escopo>/<modulo>.py
    #     requirements: [RF-01]
    #     contains: ["logger."]
    #     min_count: 1
  verify: {}
    # extra_commands: []           # validações adicionais além do test_command

enforcement:
  blocked_tool_calls: review       # review | fail

manual_review:
  contract:
    must: []
    must_not: []
  forbidden:
    behaviors: []
  review:
    focus: []
